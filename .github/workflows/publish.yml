name: Auto Publish to NPM 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Build library bundle & types
        run: npm run build:lib

      - name: 🚀 Publish to NPM
        run: |
          npm publish --access public || echo "Version already published or failed"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
